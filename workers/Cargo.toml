[package]
name = "facet-private-vault"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde_json = "=1.0.145"
sha2 = "=0.10.9"
hex = "=0.4.3"
base64 = "=0.22.1"
aes-gcm = "=0.10.3"
rand = "=0.8.5"
ed25519-dalek = "=2.2.0"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
hkdf = "=0.12.4"

[target.'cfg(target_os = "wasi")'.dependencies]
outlayer = { version = "=0.2.1", features = ["encryption-keys"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
panic = "abort"
debug = false

[profile.dev]
debug = false
